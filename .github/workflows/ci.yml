name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 本仓 checkout 到仓名目录（跨仓 ProjectReference 解析到同级 <dep>/ 目录）
      - uses: actions/checkout@v4
        with:
          path: aether-coin
      # 跨仓依赖（本地 ProjectReference 拓扑——切 PackageReference 后可移除）：
      # coin 宿主 → ① aether-ledger（账本库）+ ④ aether-exchange（钱包 withdraw 的 JSON-RPC 客户端）
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/aether-ledger
          path: aether-ledger
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/aether-exchange
          path: aether-exchange

      # 防复发：csproj 里每个 `..\..\..\<repo>\…` 都必须在同级目录存在，否则 MSB3202。
      # 本地工作区永远解析得到（15 仓并排），只有干净的 CI runner 会暴露。
      - name: Assert cross-repo checkouts match csproj references
        shell: bash
        run: |
          missing=0
          for ref in $(grep -rhoE '(\.\.[\\/]){2,3}[A-Za-z0-9._-]+' aether-coin --include='*.csproj' \
                       | sed -E 's/^(\.\.[\\/]){2,3}//' | sort -u); do
            case "$ref" in
              src|tests|Aether.*) continue ;;   # 仓内相对路径
            esac
            if [ ! -d "$ref" ]; then
              echo "::error::csproj 引用了兄弟仓 '$ref'，但 CI 没有 checkout 它（见上方 checkout 列表）"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # GitHub Packages 私有源凭据（GITHUB_TOKEN 只写进 CI 运行时文件，不入库）
      - name: Configure GitHub Packages credentials
        run: >
          dotnet nuget update source github
          --configfile aether-coin/nuget.config
          --username AetherAxis
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      # 只构建能在这台 runner 上跑的目标：节点 / 钱包 CLI / 验证器 / 桌面钱包 UI。
      # android / ios 两个 head 在 slnx 里（IDE 可见），但 Linux runner 没有对应 workload——
      # 它们由 macOS 本地构建，不进 CI（与 ⑮ 的做法一致：CI 明确指定项目，不 build 整个 slnx）。
      - name: Build (hosts + desktop wallet UI)
        run: |
          dotnet build Aether.Ledger.Node/Aether.Ledger.Node.csproj -c Release
          dotnet build Aether.Ledger.Wallet/Aether.Ledger.Wallet.csproj -c Release
          dotnet build Aether.Ledger.Verify/Aether.Ledger.Verify.csproj -c Release
          dotnet build Aether.Ledger.Wallet.Desktop/Aether.Ledger.Wallet.Desktop.csproj -c Release
        working-directory: aether-coin

      - name: Test (wallet CLI regression)
        run: dotnet test tests/Aether.Ledger.Wallet.Tests/Aether.Ledger.Wallet.Tests.csproj -c Release
        working-directory: aether-coin

      # 钱包 UI 的无头自检：进程内起真节点 → 从日志读 treasury 种子 → 走 VM 命令建/导钱包 + 转账 → 查余额。
      # 没有 GUI 也能验「界面绑定的属性名与命令真的通」——与 ⑮ 的 --smoke 同一个思路。
      - name: Wallet UI selftest (headless)
        run: dotnet run --project Aether.Ledger.Wallet.Desktop -c Release -- --selftest
        working-directory: aether-coin
